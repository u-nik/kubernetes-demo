---
- name: Initialize Kubernetes cluster stack
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: cluster_name_input
      prompt: "Enter cluster name (or set CLUSTER_NAME env var to skip)"
      default: "{{ lookup('env', 'CLUSTER_NAME') | default('kubernetes-demo', true) }}"
      private: false

  vars:
    cluster_name: "{{ cluster_name_input }}"
    bootstrap_argocd_namespace: "{{ argocd_namespace | default('argocd') }}"
    bootstrap_vault_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://localhost:8200', true) }}"
    bootstrap_vault_token: "{{ lookup('env', 'VAULT_TOKEN') | default('myroot', true) }}"
    bootstrap_repo_url: "{{ repo_url | default('git@bitbucket.org:storelogix/kubernetes-demo.git') }}"
    root_dir: "{{ playbook_dir | dirname }}"
    terraform_dir: "{{ root_dir }}/infrastructure/terraform/kind-local"

  tasks:
    - name: Check required commands are available
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - kubectl
        - helm
        - curl
        - docker
        - terraform
        - kind

    - name: Display cluster name
      ansible.builtin.debug:
        msg: "Creating KIND cluster: {{ cluster_name }}"

    - name: Initialize Terraform
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ terraform_dir }}"
      changed_when: false

    - name: Apply Terraform to create KIND cluster
      ansible.builtin.command:
        cmd: >-
          terraform apply -auto-approve
          -var="cluster_name={{ cluster_name }}"
        chdir: "{{ terraform_dir }}"
      register: terraform_apply

    - name: Get kubeconfig path from Terraform
      ansible.builtin.command:
        cmd: terraform output -raw kubeconfig_path
        chdir: "{{ terraform_dir }}"
      register: kubeconfig_path_result
      changed_when: false

    - name: Set KUBECONFIG for subsequent tasks
      ansible.builtin.set_fact:
        kubeconfig_export: "{{ kubeconfig_path_result.stdout }}"

    - name: Export kubeconfig to user home
      ansible.builtin.shell: |
        terraform -chdir="{{ terraform_dir }}" output -raw kubeconfig > "${HOME}/.kube/kind-{{ cluster_name }}-config"
        chmod 600 "${HOME}/.kube/kind-{{ cluster_name }}-config"
      args:
        executable: /bin/bash

    - name: Verify Kubernetes connectivity
      ansible.builtin.command: kubectl cluster-info
      changed_when: false
      environment:
        KUBECONFIG: "{{ kubeconfig_export }}"

    - name: Check Vault health endpoint
      ansible.builtin.uri:
        url: "{{ bootstrap_vault_addr }}/v1/sys/health"
        method: GET
        return_content: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health
      failed_when: false
      changed_when: false

    - name: Start local dev Vault container if Vault is unreachable
      ansible.builtin.shell: |
        docker stop vault >/dev/null 2>&1 || true
        docker rm vault >/dev/null 2>&1 || true
        docker run -d --name vault \
          --cap-add=IPC_LOCK \
          -e VAULT_DEV_ROOT_TOKEN_ID={{ bootstrap_vault_token | quote }} \
          -p 8200:8200 \
          hashicorp/vault >/dev/null
      args:
        executable: /bin/bash
      when: vault_health.status is not defined

    - name: Wait for Vault API to become reachable
      ansible.builtin.uri:
        url: "{{ bootstrap_vault_addr }}/v1/sys/health"
        method: GET
        return_content: false
        status_code: [200, 429, 472, 473, 501, 503]
      register: vault_health_wait
      retries: 30
      delay: 2
      until: vault_health_wait.status is defined
      changed_when: false

    - name: Read enabled Vault secrets engines
      ansible.builtin.command: >-
        docker exec -e VAULT_ADDR=http://127.0.0.1:8200
        -e VAULT_TOKEN={{ bootstrap_vault_token }}
        vault vault secrets list
      register: vault_secrets
      changed_when: false

    - name: Enable Vault KV v2 engine at secret/
      ansible.builtin.command: >-
        docker exec -e VAULT_ADDR=http://127.0.0.1:8200
        -e VAULT_TOKEN={{ bootstrap_vault_token }}
        vault vault secrets enable -version=2 -path=secret kv
      when: "'secret/' not in vault_secrets.stdout"

    - name: Create temp directory for SSH key
      ansible.builtin.tempfile:
        state: directory
        suffix: _argocd_git
      register: bitbucket_key_dir

    - name: Set SSH key file path
      ansible.builtin.set_fact:
        bitbucket_key_path: "{{ bitbucket_key_dir.path }}/argocd_git_key"

    - name: Write SSH private key from Vault directly to file
      ansible.builtin.shell: |
        docker exec -e VAULT_ADDR={{ bootstrap_vault_addr }} \
          -e VAULT_TOKEN={{ bootstrap_vault_token }} \
          vault vault kv get -field=sshPrivateKey secret/git/bitbucket \
          > "{{ bitbucket_key_path }}"
        chmod 600 "{{ bitbucket_key_path }}"
      args:
        executable: /bin/bash
      no_log: true

    - name: Verify SSH key is valid
      ansible.builtin.command: ssh-keygen -lf "{{ bitbucket_key_path }}"
      register: ssh_key_check
      changed_when: false
      failed_when: false

    - name: Fail if SSH key from Vault is invalid
      ansible.builtin.fail:
        msg: >-
          SSH private key from Vault is invalid.
          ssh-keygen output: {{ ssh_key_check.stderr | default('') }}
          Ensure the key was stored with: vault kv put secret/git/bitbucket sshPrivateKey=@/path/to/keyfile
      when: ssh_key_check.rc != 0

    - name: Read repository URL from Vault
      ansible.builtin.shell: |
        docker exec -e VAULT_ADDR={{ bootstrap_vault_addr }} \
          -e VAULT_TOKEN={{ bootstrap_vault_token }} \
          vault vault kv get -field=url secret/git/bitbucket
      args:
        executable: /bin/bash
      register: bitbucket_repo_vault
      changed_when: false
      failed_when: false
      no_log: true

    - name: Override repo URL from Vault when available
      ansible.builtin.set_fact:
        bootstrap_repo_url: "{{ (bitbucket_repo_vault.stdout | default('')) | trim }}"
      when: bitbucket_repo_vault.rc == 0 and (bitbucket_repo_vault.stdout | default('')) | trim | length > 0

    - name: Validate Bitbucket SSH access against repository
      ansible.builtin.shell: |
        GIT_SSH_COMMAND='ssh -i {{ bitbucket_key_path }} -o StrictHostKeyChecking=no' \
          git ls-remote "{{ bootstrap_repo_url }}" HEAD >/dev/null
      args:
        executable: /bin/bash
      changed_when: false
      no_log: false

    - name: Add Helm repositories
      ansible.builtin.command: "{{ item }}"
      changed_when: false
      loop:
        - helm repo add traefik https://traefik.github.io/charts --force-update
        - helm repo add external-secrets https://charts.external-secrets.io --force-update
        - helm repo update

    - name: Ensure External Secrets CRDs are applied
      ansible.builtin.shell: |
        eso_crds="$(helm show crds external-secrets/external-secrets || true)"
        if [[ -n "${eso_crds}" ]]; then
          printf '%s\n' "${eso_crds}" | kubectl apply -f -
        else
          echo "No CRDs returned by helm show crds; skipping pre-apply."
        fi
      args:
        executable: /bin/bash
      register: eso_crds_apply
      changed_when: "'created' in eso_crds_apply.stdout or 'configured' in eso_crds_apply.stdout"

    - name: Install or upgrade Traefik
      ansible.builtin.command: >-
        helm upgrade --install traefik traefik/traefik
        -n kube-system
        --create-namespace
      changed_when: false

    - name: Update Helm dependencies for ArgoCD chart
      ansible.builtin.command: "helm dependency update {{ root_dir }}/kubernetes/manifests/argocd"
      changed_when: false

    - name: Install or upgrade ArgoCD
      ansible.builtin.command: >-
        helm upgrade --install argocd {{ root_dir }}/kubernetes/manifests/argocd
        -n {{ bootstrap_argocd_namespace }}
        --create-namespace
      changed_when: false

    - name: Wait for ArgoCD server deployment
      ansible.builtin.command: >-
        kubectl wait --for=condition=available deployment/argocd-server
        -n {{ bootstrap_argocd_namespace }}
        --timeout=300s
      changed_when: false

    - name: Apply bootstrap ArgoCD repository credential secret
      ansible.builtin.shell: |
        secret_args=(
          --from-literal=type=git
          --from-literal=url={{ bootstrap_repo_url }}
          --from-file=sshPrivateKey={{ bitbucket_key_path }}
          --from-literal=insecureIgnoreHostKey=true
        )
        kubectl create secret generic git-repository-credentials \
          -n {{ bootstrap_argocd_namespace }} \
          --type=Opaque \
          "${secret_args[@]}" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl label secret git-repository-credentials \
          -n {{ bootstrap_argocd_namespace }} \
          argocd.argoproj.io/secret-type=repository --overwrite
      args:
        executable: /bin/bash
      register: repo_secret_apply
      changed_when: "'created' in repo_secret_apply.stdout or 'configured' in repo_secret_apply.stdout"
      no_log: true

    - name: Apply Vault token secret for SecretStore auth
      ansible.builtin.shell: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Secret
        metadata:
          name: vault-token
          namespace: {{ bootstrap_argocd_namespace }}
        type: Opaque
        stringData:
          token: {{ bootstrap_vault_token }}
        EOF
      args:
        executable: /bin/bash
      register: vault_token_secret_apply
      changed_when: "'created' in vault_token_secret_apply.stdout or 'configured' in vault_token_secret_apply.stdout"
      no_log: true

    - name: Install or upgrade External Secrets Operator
      ansible.builtin.command: >-
        helm upgrade --install external-secrets external-secrets/external-secrets
        -n external-secrets-system
        --set installCRDs=true
        --create-namespace
      changed_when: false

    - name: Wait for External Secrets Operator deployment
      ansible.builtin.command: >-
        kubectl wait --for=condition=available deployment/external-secrets
        -n external-secrets-system
        --timeout=300s
      changed_when: false

    - name: Wait for External Secrets webhook deployment
      ansible.builtin.command: >-
        kubectl wait --for=condition=available deployment/external-secrets-webhook
        -n external-secrets-system
        --timeout=300s
      changed_when: false

    - name: Wait for External Secrets cert-controller deployment
      ansible.builtin.command: >-
        kubectl wait --for=condition=available deployment/external-secrets-cert-controller
        -n external-secrets-system
        --timeout=300s
      changed_when: false

    - name: Wait for External Secrets webhook endpoints
      ansible.builtin.command: >-
        kubectl get endpoints external-secrets-webhook
        -n external-secrets-system
        -o jsonpath={.subsets[0].addresses[0].ip}
      register: eso_webhook_endpoints
      changed_when: false
      retries: 30
      delay: 2
      until: eso_webhook_endpoints.stdout is match('^\\d+\\.\\d+\\.\\d+\\.\\d+$')

    - name: Wait for External Secrets CRDs
      ansible.builtin.command: kubectl get crd {{ item }}
      register: eso_crd_check
      changed_when: false
      retries: 30
      delay: 2
      until: eso_crd_check.rc == 0
      loop:
        - externalsecrets.external-secrets.io
        - secretstores.external-secrets.io
        - clustersecretstores.external-secrets.io

    - name: Install or upgrade Vault SecretStore chart
      ansible.builtin.command: >-
        helm upgrade --install vault-secretstore {{ root_dir }}/kubernetes/manifests/vault-secretstore
        -n {{ bootstrap_argocd_namespace }}
        --create-namespace
      changed_when: false

    - name: Install or upgrade ArgoCD git credentials chart
      ansible.builtin.command: >-
        helm upgrade --install argocd-git-credentials {{ root_dir }}/kubernetes/manifests/argocd-git-credentials
        -n {{ bootstrap_argocd_namespace }}
        --create-namespace
      changed_when: false

    - name: Apply ArgoCD applications
      ansible.builtin.command: "kubectl apply -f {{ item }}"
      changed_when: false
      loop:
        - "{{ root_dir }}/kubernetes/apps/vault-secretstore.yaml"
        - "{{ root_dir }}/kubernetes/apps/argocd-git-credentials.yaml"
        - "{{ root_dir }}/kubernetes/apps/root.yaml"

    - name: Force ArgoCD app refresh
      ansible.builtin.command: >-
        kubectl annotate application {{ item }}
        -n {{ bootstrap_argocd_namespace }}
        argocd.argoproj.io/refresh=hard --overwrite
      changed_when: false
      failed_when: false
      loop:
        - root-apps
        - argocd-git-credentials

    - name: Show verification commands
      ansible.builtin.debug:
        msg:
          - "Cluster initialization complete."
          - "kubectl get pods -n kube-system"
          - "kubectl get pods -n {{ bootstrap_argocd_namespace }}"
          - "kubectl get applications -n {{ bootstrap_argocd_namespace }}"
          - "kubectl get secret git-repository-credentials -n {{ bootstrap_argocd_namespace }}"
          - "kubectl get externalsecret -n {{ bootstrap_argocd_namespace }}"
