apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-config
  namespace: myapp
spec:
  refreshInterval: 30m
  secretStoreRef:
    # Same SecretStore works across namespaces (if ClusterSecretStore)
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: app-config-secret
    creationPolicy: Owner
    template:
      # You can use templates to combine multiple values
      data:
        config.yaml: |
          database:
            host: {{ .db_host }}
            port: {{ .db_port }}
            name: {{ .db_name }}
          redis:
            host: {{ .redis_host }}
          feature_flags:
            new_ui: {{ .feature_new_ui }}
  data:
    - secretKey: db_host
      remoteRef:
        key: myapp/config
        property: db_host
    - secretKey: db_port
      remoteRef:
        key: myapp/config
        property: db_port
    - secretKey: db_name
      remoteRef:
        key: myapp/config
        property: db_name
    - secretKey: redis_host
      remoteRef:
        key: myapp/config
        property: redis_host
    - secretKey: feature_new_ui
      remoteRef:
        key: myapp/config
        property: feature_new_ui
