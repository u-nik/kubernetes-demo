apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    # Reuse the existing SecretStore!
    name: vault-cluster-secretstore
    kind: ClusterSecretStore
  target:
    name: postgresql-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: database/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: database/postgresql
        property: password
    - secretKey: host
      remoteRef:
        key: database/postgresql
        property: host
