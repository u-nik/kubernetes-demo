---
# Initialize Kubernetes control plane on master node
- name: Initialize Kubernetes Control Plane
  hosts: k8s_masters
  gather_facts: yes
  become: yes
  tasks:
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Initialize Kubernetes cluster with kubeadm
      shell: |
        kubeadm init \
          --pod-network-cidr=10.244.0.0/16 \
          --apiserver-advertise-address={{ ansible_default_ipv4.address }} \
          --control-plane-endpoint={{ ansible_default_ipv4.address }}
      register: kubeadm_init
      when: not k8s_initialized.stat.exists

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: '0600'

    - name: Install Calico CNI network plugin
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not k8s_initialized.stat.exists

    - name: Wait for all nodes to be ready
      shell: kubectl get nodes | grep -c " Ready"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ready_nodes
      until: ready_nodes.stdout|int >= 1
      retries: 30
      delay: 10
      changed_when: false

    - name: Generate join command
      shell: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Save join command to local file
      delegate_to: localhost
      become: no
      copy:
        content: "{{ join_command.stdout }}"
        dest: "/tmp/k8s_join_command.sh"

    - name: Display join command
      debug:
        msg: "{{ join_command.stdout }}"
