apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "example-app.fullname" . }}-otel-config
  namespace: example-app
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 100
      
      # Add resource attributes
      resource:
        attributes:
          - key: service.name
            value: example-app-nginx
            action: upsert
          - key: service.namespace
            value: example-app
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert
      
      # Memory limiter
      memory_limiter:
        check_interval: 1s
        limit_mib: 100

    exporters:
      otlp:
        endpoint: {{ .Values.otelCollector.tempo.endpoint }}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      
      logging:
        loglevel: info

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp, logging]
