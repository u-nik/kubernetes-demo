apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "example-app.fullname" . }}-trace-generator
  namespace: example-app
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
data:
  generate-traces.py: |
    #!/usr/bin/env python3
    import time
    import random
    import json
    from opentelemetry import trace
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.resources import Resource
    
    # Setup tracer
    resource = Resource(attributes={
        "service.name": "trace-generator",
        "service.namespace": "example-app",
        "deployment.environment": "production"
    })
    
    provider = TracerProvider(resource=resource)
    processor = BatchSpanProcessor(
        OTLPSpanExporter(
            endpoint="localhost:4317",
            insecure=True
        )
    )
    provider.add_span_processor(processor)
    trace.set_tracer_provider(provider)
    
    tracer = trace.get_tracer(__name__)
    
    # Generate traces
    print("Starting trace generator...")
    print("Generating traces to Tempo via local OTel collector...")
    
    operations = ["homepage", "api_call", "database_query", "cache_lookup", "external_api"]
    
    while True:
        operation = random.choice(operations)
        
        with tracer.start_as_current_span(f"example-app.{operation}") as span:
            span.set_attribute("http.method", random.choice(["GET", "POST", "PUT"]))
            span.set_attribute("http.status_code", random.choice([200, 201, 400, 404, 500]))
            span.set_attribute("user.id", f"user-{random.randint(1, 100)}")
            
            # Simulate work
            duration = random.uniform(0.01, 0.5)
            time.sleep(duration)
            
            # Child span
            with tracer.start_as_current_span(f"{operation}.processing") as child_span:
                child_span.set_attribute("processing.duration_ms", duration * 1000)
                time.sleep(duration * 0.5)
        
        print(f"Generated trace for: {operation}")
        time.sleep(random.uniform(1, 3))
