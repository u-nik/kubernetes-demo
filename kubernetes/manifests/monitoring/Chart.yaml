apiVersion: v2
name: monitoring
description: Umbrella chart for monitoring stack
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: grafana
    version: 10.5.15
    repository: "https://grafana.github.io/helm-charts"
  - name: prometheus
