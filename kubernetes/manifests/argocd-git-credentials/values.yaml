# ArgoCD Git Credentials Configuration

# Enable/disable the git credentials secret
enabled: true

# Target namespace where the secret will be created (should be argocd)
namespace: argocd

# Source for credentials: "direct" or "vault"
# - direct: Create secret directly with credentials (requires repository.auth values)
# - vault: Use External Secrets Operator to fetch from Vault
source: vault

# Git repository configuration
repository:
  # Repository URL (e.g., git@bitbucket.org:storelogix/kubernetes-demo.git)
  url: "git@bitbucket.org:storelogix/kubernetes-demo.git"

  # Direct authentication credentials (only used when source=direct)
  auth:
    # Type of authentication: ssh, token, or password
    type: ssh

    # Bitbucket username (token/password auth only)
    username: ""

    # Bitbucket App Password or Personal Access Token (token/password auth only)
    token: ""

    # SSH private key (ssh auth only)
    sshPrivateKey: ""

    # Optional SSH known hosts (ssh auth only)
    sshKnownHosts: ""

    # Disable host key checking (ssh auth only)
    insecureIgnoreHostKey: true

# Vault configuration (only used when source=vault)
vault:
  # SecretStore reference
  secretStore:
    name: "vault-secretstore"
    kind: "SecretStore"  # or "ClusterSecretStore"
  
  # Vault path for git credentials
  # For KV v2: path should be like "git/bitbucket"
  # Vault will look for keys:
  # - token/password auth: username, password, url
  # - ssh auth: sshPrivateKey, url, (optional) sshKnownHosts
  path: "git/bitbucket"

  # Include sshKnownHosts from Vault when using ssh auth
  includeKnownHosts: false
  
  # Refresh interval for syncing from Vault
  refreshInterval: "1h"

