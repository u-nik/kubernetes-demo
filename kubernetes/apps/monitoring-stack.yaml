apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitbucket.org/storelogix/kubernetes-demo.git
    targetRevision: main
    path: kubernetes/manifests/monitoring
    helm:
      releaseName: monitoring-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    # Uncomment the following lines to enable automated syncing and self-healing. Be cautious with automated pruning in production environments!
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
